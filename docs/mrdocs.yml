# MrDocs configuration: generates the API reference that CI publishes to
# GitHub Pages. Run from the repository root:
#   mrdocs docs/mrdocs.yml
source-root: ..
includes:
  - ../include
defines:
  - CPTR_DOCS
input:
  - ../include
file-patterns:
  - '*.hpp'
include-symbols:
  - 'cptr::**'
  - 'std::hash'
# The containers are cptr::detail::basic_* class templates behind the
# public aliases (cptr::list = basic_list<T, Cage, true>); they are
# documented so that the aliases lead to a member list. The rest of
# detail is internal.
exclude-symbols:
  - 'cptr::detail::spin_lock'
  - 'cptr::detail::lock_guard'
  - 'cptr::detail::kMaxSmall'
  - 'cptr::detail::class_count'
  - 'cptr::detail::make_class_sizes'
  - 'cptr::detail::kClassSizes'
  - 'cptr::detail::reserve_aligned'
  - 'cptr::detail::commit'
  - 'cptr::detail::decommit'
  - 'cptr::detail::purge'
  - 'cptr::link'
implementation-defined: []
generator: html
multipage: true
output: ../build-docs/site
base-url: https://github.com/mvanslobbe/compressed-ptr/blob/main/
auto-brief: true
auto-relates: true
overloads: true
sort-members: true
warnings: true
warn-if-undocumented: false
