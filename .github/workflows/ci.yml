name: CI

on:
  push:
  pull_request:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-gcc, os: ubuntu-24.04, cxx: g++-14 }
          - { name: linux-x64-clang, os: ubuntu-24.04, cxx: clang++-18 }
          - { name: linux-arm64-gcc, os: ubuntu-24.04-arm, cxx: g++-14 }
          - { name: macos-arm64-clang, os: macos-15, cxx: clang++ }
          - { name: macos-x64-clang, os: macos-15-intel, cxx: clang++ }
          - { name: windows-x64-msvc, os: windows-2022, cxx: cl }
          - { name: windows-arm64-msvc, os: windows-11-arm, cxx: cl }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCOMPRESSED_PTR_WERROR=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Benchmarks (smoke)
        shell: bash
        run: |
          dir=build; [ -d build/Release ] && dir=build/Release
          "$dir/bench_rss" 200000
          "$dir/bench_runtime" 100000 200

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Use-after-free is reported
        run: |
          clang++-18 -std=c++20 -g -fsanitize=address -Iinclude examples/use_after_free.cpp -o uaf
          ! ./uaf 2> uaf.log
          grep -q "use-after-poison" uaf.log

  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOMPRESSED_PTR_BUILD_TESTS=OFF
          cmake --build build --target bench_runtime bench_rss
      - name: Run
        run: |
          ./build/bench_runtime 262144 2000 | tee bench.md
          ./build/bench_rss 200000 | tee rss.txt
          { echo '## Benchmarks'; cat bench.md; echo; echo '```'; cat rss.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check for regressions
        run: python3 scripts/check_bench.py bench.md
      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: |
            bench.md
            rss.txt

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build-fuzz -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCOMPRESSED_PTR_BUILD_FUZZERS=ON -DCOMPRESSED_PTR_BUILD_TESTS=OFF \
            -DCOMPRESSED_PTR_BUILD_EXAMPLES=OFF -DCOMPRESSED_PTR_BUILD_BENCHMARKS=OFF
          cmake --build build-fuzz --target fuzz_allocator fuzz_containers
      - name: Fuzz for a minute each
        run: |
          mkdir -p corpus-allocator corpus-containers
          ./build-fuzz/fuzz_allocator -max_total_time=60 -max_len=8192 corpus-allocator
          ./build-fuzz/fuzz_containers -max_total_time=60 -max_len=4096 corpus-containers

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCOMPRESSED_PTR_BUILD_BENCHMARKS=OFF
      - name: clang-tidy
        run: scripts/run_tidy.sh build clang-tidy-18

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Single header is up to date
        run: python3 scripts/amalgamate.py --check
      - name: Install clang-format
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q
          sudo apt-get install -y -q clang-format-22
      - name: Check formatting
        run: >
          git ls-files '*.hpp' '*.cpp' ':!bench/third_party' ':!single_include'
          | xargs clang-format-22 --dry-run --Werror

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and use with find_package
        shell: bash
        run: scripts/test_install.sh

  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # TSan in clang 18 cannot handle the runner's default ASLR entropy.
      - name: Reduce ASLR entropy
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_CXX_FLAGS="-fsanitize=thread"
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure
      - name: Multi-threaded benchmark
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./build/bench_runtime 16384 64 threads

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Coverage
        run: LLVM_SUFFIX=-18 CXX=clang++-18 scripts/coverage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: build-coverage/coverage-html
