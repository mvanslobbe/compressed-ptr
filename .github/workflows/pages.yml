name: Pages

# Publishes to the gh-pages branch, which GitHub Pages serves:
#   /            docs/site/index.html
#   /reference/  API reference generated by MrDocs
#   /coverage/   llvm-cov report and the coverage badge's JSON
#   /bench/      benchmark history (github-action-benchmark)
# The jobs run one after another because each pushes to gh-pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

env:
  MRDOCS_RELEASE: "2026.9.29"

jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MrDocs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MRDOCS_RELEASE" -R cppalliance/mrdocs \
            -p "MrDocs-$MRDOCS_RELEASE-Linux.tar.xz" -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/mrdocs"
          tar xf "$RUNNER_TEMP/MrDocs-$MRDOCS_RELEASE-Linux.tar.xz" \
            -C "$RUNNER_TEMP/mrdocs" --strip-components=1
          "$RUNNER_TEMP/mrdocs/bin/mrdocs" --version
      - name: Generate
        run: '"$RUNNER_TEMP/mrdocs/bin/mrdocs" docs/mrdocs.yml'
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build-docs/site
          destination_dir: reference
          commit_message: "Update the API reference for ${{ github.sha }}"
      - name: Render the guide and the benchmarks page
        run: |
          pip install --quiet markdown
          mkdir -p site
          cp docs/site/*.html site/
          python3 scripts/render_docs.py site
      - name: Landing page, guide and benchmarks
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: true
          commit_message: "Update the documentation pages for ${{ github.sha }}"

  coverage:
    needs: reference
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Coverage
        run: LLVM_SUFFIX=-18 CXX=clang++-18 scripts/coverage.sh
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build-coverage/coverage-html
          destination_dir: coverage
          commit_message: "Update coverage for ${{ github.sha }}"

  benchmark-history:
    needs: coverage
    runs-on: ubuntu-24.04
    env:
      # Keep the tree clean: the benchmark action switches to gh-pages.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOMPRESSED_PTR_BUILD_TESTS=OFF
          cmake --build build --target bench_runtime
      - name: Run
        run: |
          # 10,000 epochs, as on the reference machine: p99.5 is then the
          # 50th-slowest sample rather than the 10th.
          BENCH_TSV=bench.tsv ./build/bench_runtime 262144 10000 | tee bench.md
          python3 scripts/bench_to_json.py bench.tsv bench
      # One history comparing compressed with raw pointers on the
      # representative benchmarks (scripts/bench_reps.py), then one history
      # of absolute times per percentile. Shared runners vary a lot from run
      # to run, so this records and plots but never fails on an alert;
      # scripts/check_bench.py in CI gates on deltas measured within one run.
      - name: Record compressed as % of raw pointers
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: compressed as % of raw pointers
          tool: customSmallerIsBetter
          output-file-path: bench-vs-raw.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "150%"
          fail-on-alert: false
          comment-on-alert: false
      - name: Record bench_runtime p50
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: bench_runtime p50
          tool: customSmallerIsBetter
          output-file-path: bench-p50.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "150%"
          fail-on-alert: false
          comment-on-alert: false
      - name: Record bench_runtime p90
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: bench_runtime p90
          tool: customSmallerIsBetter
          output-file-path: bench-p90.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "150%"
          fail-on-alert: false
          comment-on-alert: false
      - name: Record bench_runtime p95
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: bench_runtime p95
          tool: customSmallerIsBetter
          output-file-path: bench-p95.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "150%"
          fail-on-alert: false
          comment-on-alert: false
      - name: Record bench_runtime p99
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: bench_runtime p99
          tool: customSmallerIsBetter
          output-file-path: bench-p99.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "150%"
          fail-on-alert: false
          comment-on-alert: false
      - name: Record bench_runtime p99.5
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: bench_runtime p99.5
          tool: customSmallerIsBetter
          output-file-path: bench-p99.5.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "150%"
          fail-on-alert: false
          comment-on-alert: false
