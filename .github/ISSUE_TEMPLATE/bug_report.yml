name: Bug report
description: Something does not compile, crashes, or gives the wrong result.
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Minimal program
      description: A short, complete program that shows the problem.
      render: cpp
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What happened, and what you expected
      description: The exact compiler error, crash, or sanitizer report, and the result you expected.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Compiler, standard library and OS
      placeholder: e.g. GCC 15.2, libstdc++, Ubuntu 24.04, x86-64
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: compressed-ptr version or commit
